[package]
name = "vouch-device-flow"
version = "0.1.0"
edition = "2021"

[dependencies]
# jsonwebtoken 11 panics at first use unless exactly one crypto provider feature is
# enabled. rust_crypto is the pure-Rust one, matching the rustls-only reqwest below.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.13", features = ["json", "form", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
