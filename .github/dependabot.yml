# Dependabot: one PR for all dependency updates across all examples
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/configuring-multi-ecosystem-updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

multi-ecosystem-groups:
  all:
    schedule:
      interval: "weekly"
      day: "monday"

updates:
  - package-ecosystem: "npm"
    directories:
      - "/mcp/remote-server-ts"
      - "/native/node"
      - "/spa/angular"
      - "/spa/bff-express"
      - "/spa/react"
      - "/spa/sveltekit"
      - "/spa/vanilla-js"
      - "/spa/vue"
      - "/tests"
      - "/web/express-openid"
      - "/web/nextjs-nextauth"
    patterns: ["*"]
    cooldown:
      default-days: 7
    multi-ecosystem-group: "all"

  - package-ecosystem: "pip"
    directories:
      - "/a2a/python-agent"
      - "/mcp/credential-broker"
      - "/mcp/remote-server-py"
      - "/native/python"
      - "/native/python-agent-aws"
      - "/native/python-agent-github"
      - "/native/python-agent-multi"
      - "/web/django-allauth"
      - "/web/fastapi-authlib"
      - "/web/flask-authlib"
    patterns: ["*"]
    cooldown:
      default-days: 7
    multi-ecosystem-group: "all"

  - package-ecosystem: "docker"
    directories:
      - "/a2a/python-agent"
      - "/mcp/credential-broker"
      - "/mcp/remote-server-py"
      - "/mcp/remote-server-ts"
      - "/native/node"
      - "/native/python"
      - "/native/python-agent-aws"
      - "/native/python-agent-github"
      - "/native/python-agent-multi"
      - "/native/rust"
      - "/spa/angular"
      - "/spa/bff-express"
      - "/spa/react"
      - "/spa/sveltekit"
      - "/spa/vanilla-js"
      - "/spa/vue"
      - "/web/aspnet-core"
      - "/web/axum-openidconnect"
      - "/web/django-allauth"
      - "/web/express-openid"
      - "/web/fastapi-authlib"
      - "/web/flask-authlib"
      - "/web/go-oidc"
      - "/web/laravel-socialite"
      - "/web/nextjs-nextauth"
      - "/web/rails-omniauth"
      - "/web/spring-boot"
    patterns: ["*"]
    cooldown:
      default-days: 7
    multi-ecosystem-group: "all"

  - package-ecosystem: "gomod"
    directories:
      - "/web/go-oidc"
    patterns: ["*"]
    cooldown:
      default-days: 7
    multi-ecosystem-group: "all"

  - package-ecosystem: "cargo"
    directories:
      - "/native/rust"
      - "/web/axum-openidconnect"
    patterns: ["*"]
    cooldown:
      default-days: 7
    multi-ecosystem-group: "all"

  - package-ecosystem: "bundler"
    directories:
      - "/web/rails-omniauth"
    patterns: ["*"]
    cooldown:
      default-days: 7
    multi-ecosystem-group: "all"

  - package-ecosystem: "composer"
    directories:
      - "/web/laravel-socialite"
    patterns: ["*"]
    cooldown:
      default-days: 7
    multi-ecosystem-group: "all"

  - package-ecosystem: "maven"
    directories:
      - "/web/spring-boot"
    patterns: ["*"]
    cooldown:
      default-days: 7
    multi-ecosystem-group: "all"

  - package-ecosystem: "nuget"
    directories:
      - "/web/aspnet-core"
    patterns: ["*"]
    cooldown:
      default-days: 7
    multi-ecosystem-group: "all"

  # Workflow actions are SHA-pinned and enforced by secure_workflows.yml, so without
  # this they never move. Dependabot preserves the `owner/repo@<sha> # vX.Y.Z` form
  # and updates both halves together.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    patterns: ["*"]
    cooldown:
      default-days: 7
    multi-ecosystem-group: "all"
