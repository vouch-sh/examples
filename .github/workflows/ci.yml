# CI: build each example, then start it and check it actually serves.
#
# Building alone is not enough: an example whose dependencies resolved to a breaking
# major still builds fine and only fails when the process starts, so the smoke step
# is what gives this workflow real signal. It uses throwaway credentials and needs no
# Vouch account. The credentialed end-to-end suite in tests/ is run by hand.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test example
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: a2a/python-agent
          - directory: mcp/credential-broker
          - directory: mcp/remote-server-py
          - directory: mcp/remote-server-ts
          - directory: native/node
          - directory: native/python
          - directory: native/python-agent-aws
          - directory: native/python-agent-github
          - directory: native/python-agent-multi
          - directory: native/rust
          - directory: spa/angular
          - directory: spa/bff-express
          - directory: spa/react
          - directory: spa/sveltekit
          - directory: spa/vanilla-js
          - directory: spa/vue
          - directory: web/aspnet-core
          - directory: web/axum-openidconnect
          - directory: web/django-allauth
          - directory: web/express-openid
          - directory: web/fastapi-authlib
          - directory: web/flask-authlib
          - directory: web/go-oidc
          - directory: web/laravel-socialite
          - directory: web/nextjs-nextauth
          - directory: web/rails-omniauth
          - directory: web/spring-boot

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build example image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.directory }}
          push: false
          # load makes the image available to the local daemon so the next step can run it.
          load: true
          tags: vouch-example:${{ strategy.job-index }}
          cache-from: type=gha,scope=${{ matrix.directory }}
          cache-to: type=gha,mode=max,scope=${{ matrix.directory }}

      - name: Smoke-test example
        env:
          EXAMPLE_DIR: ${{ matrix.directory }}
          IMAGE_TAG: vouch-example:${{ strategy.job-index }}
        run: ./scripts/smoke.sh "$EXAMPLE_DIR" "$IMAGE_TAG"
