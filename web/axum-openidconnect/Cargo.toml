[package]
name = "vouch-axum"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
# jsonwebtoken 11 panics at first use unless exactly one crypto provider feature is
# enabled. rust_crypto is the pure-Rust one, matching the rustls-only reqwest below.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
openidconnect = "4"
# Pinned to 0.12 by openidconnect 4 -> oauth2 5, which re-exports these types.
# Using a different reqwest here would not typecheck against request_async.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-sessions = "0.15"
