<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Vouch + Spring Boot</title></head>
<body>
  <h1>Vouch OIDC + Spring Boot</h1>
  <p>Signed in as <span th:text="${email}"></span></p>
  <p th:if="${hardwareVerified}"><strong>Hardware Verified</strong></p>
  <ul>
    <li>email: <span th:text="${email}"></span></li>
    <li>email_verified: <span th:text="${emailVerified}"></span></li>
    <li>sub: <span th:text="${sub}"></span></li>
    <li>amr: <span th:text="${amr != null ? #strings.listJoin(amr, ', ') : 'N/A'}"></span></li>
    <li>acr: <span th:text="${acr ?: 'N/A'}"></span></li>
    <li>hardware_verified: <span th:text="${hardwareVerified}"></span></li>
  </ul>
  <form th:action="@{/logout}" method="post">
    <button type="submit">Sign out</button>
  </form>
</body>
</html>
